name: ig-jobs
on:
  push:
    branches: [ig-assets]
    paths: ['jobs/**/*.py', 'jobs/**/*.csv', 'jobs/ACTIVE']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow pdfplumber pyshp pyproj shapely
      - run: python jobs/$(cat jobs/ACTIVE)/run.py
      - run: |
          git config user.name "ig-jobs"
          git config user.email "ig-jobs@users.noreply.github.com"
          git add jobs/*/out
          git commit -m "ig-jobs: output" || echo "niente da committare"
          git pull --rebase && git push
